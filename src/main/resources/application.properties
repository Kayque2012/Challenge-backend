# CORS - usa a variavel CORS_ORIGINS em producao (Azure/Vercel), senao libera tudo localmente
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=Content-Disposition,Location
quarkus.http.cors.access-control-max-age=PT24H

# Log
quarkus.log.console.enable=true
quarkus.log.level=INFO

# Swagger UI
quarkus.swagger-ui.enable=true
quarkus.swagger-ui.always-include=true

# Porta: Azure Container Apps injeta PORT, Railway tambem. Padrao 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# Health check para Azure Container Apps
quarkus.smallrye-health.ui.enable=true

# Banco de dados — lidos de variáveis de ambiente (definidas no .env local ou no painel de produção)
db.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
db.user=${DB_USER:}
db.password=${DB_PASSWORD:}

# ── Gmail SMTP (Quarkus Mailer) ───────────────────────────────────────────────
# Passo a passo para gerar a SENHA DE APP do Gmail:
#   1. Acesse https://myaccount.google.com/security
#   2. Ative a "Verificação em 2 etapas" (obrigatório)
#   3. Volte em Segurança > Senhas de app > Selecionar app: Correio / Outro
#   4. Copie a senha de 16 caracteres gerada (ex: abcd efgh ijkl mnop)
#   5. Cole SEM espaços na variável GMAIL_APP_PASSWORD abaixo
#
# Em produção (Azure/Railway), defina essas variáveis de ambiente no painel.
quarkus.mailer.from=${GMAIL_FROM:turmadobem.noreply@gmail.com}
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${GMAIL_USER:}
quarkus.mailer.password=${GMAIL_APP_PASSWORD:}

# Mock local (dev) — troca por false ao configurar as credenciais reais
%dev.quarkus.mailer.mock=${GMAIL_APP_PASSWORD:true}

# For�a o Quarkus a compilar tudo num �nico arquivo execut�vel
quarkus.package.type=uber-jar